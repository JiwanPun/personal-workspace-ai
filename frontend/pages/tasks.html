<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tasks | Personal Workspace AI</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Task Page CSS -->
    <link rel="stylesheet" href="../css/tasks.css">
</head>

<body>

    <!-- Navigation -->
    <nav>

        <h2>Personal Workspace AI</h2>

        <ul>
            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="dashboard.html">Dashboard</a>
            </li>

            <li>
                <a href="tasks.html" class="active">Tasks</a>
            </li>
        </ul>

    </nav>


    <!-- Main Task Page -->
    <main class="task-page">


        <!-- Page Header -->
        <div class="task-header">

            <h1>Task Manager</h1>

            <p>
                Manage your tasks and organize them according to priority.
            </p>

        </div>


        <!-- Add Task Form -->
        <div class="task-form">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task"
            >


            <select id="priorityInput">

                <option value="High">
                    High Priority
                </option>

                <option value="Medium">
                    Medium Priority
                </option>

                <option value="Low">
                    Low Priority
                </option>

            </select>


            <input
                type="date"
                id="deadlineInput"
            >


            <button
                class="add-task-btn"
                onclick="addTask()"
            >
                Add Task
            </button>

        </div>


        <!-- Tasks Section -->
        <section class="task-section">

            <h2 class="tasks-heading">
                My Tasks
            </h2>


            <!-- Tasks will be displayed here -->
            <div id="taskList">

                <!-- JavaScript will add tasks here -->

            </div>

        </section>


    </main>


    <!-- JavaScript -->
    <script src="../js/tasks.js"></script>

</body>

</html>
